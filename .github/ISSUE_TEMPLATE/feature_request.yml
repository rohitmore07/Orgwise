name: Feature request
description: Propose a new capability for the orgwise platform
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Be specific — the clearer the problem, the better the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how it should behave.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - High (core platform value)
        - Medium (significant improvement)
        - Low (nice to have)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you evaluated.
