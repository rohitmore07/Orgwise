service: orgwise-api

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: production
    DATABASE_URL: ${env:DATABASE_URL, ""}
    NEON_AUTH_BASE_URL: ${env:NEON_AUTH_BASE_URL, ""}
    SESSION_CACHE_TTL_MS: ${env:SESSION_CACHE_TTL_MS, "60000"}
    # Comma-separated browser origins allowed to call the API with credentials.
    # Must include the deployed frontend origin (e.g. https://yourapp.vercel.app)
    # or the browser will block every request (CORS).
    CORS_ORIGINS: ${env:CORS_ORIGINS, "https://people-lens-web.vercel.app"}
    ADMIN_EMAILS: ${env:ADMIN_EMAILS, ""}
    GROQ_API_KEY: ${env:GROQ_API_KEY, ""}
    OPENROUTER_API_KEY: ${env:OPENROUTER_API_KEY, ""}

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi: '*'

# The zip is produced by `scripts/package-lambda.mjs` (pnpm's symlinked
# node_modules cannot be packaged directly; the script stages a real
# production-only tree and dereferences symlinks at zip time).
package:
  artifact: .serverless-build/orgwise-api.zip
